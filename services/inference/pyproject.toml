[project]
name = "qari-inference"
version = "0.0.0"
description = "Qari AI forced-alignment inference service (ADR-001)"
requires-python = ">=3.11"
# torch==2.2.2 / transformers==4.42.3 are pinned to what actually installs
# on Intel macOS (PyTorch stopped publishing x86_64 macOS wheels after
# 2.2.2) — this pin is a development-environment constraint, not a model
# requirement. A Linux production/CI target should be able to move to a
# newer torch+transformers pair; re-verify app/model.py loads correctly
# before bumping either pin.
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "torch==2.2.2",
    "transformers==4.42.3",
    "tokenizers<0.20",
    "huggingface_hub<1.0",
    "soundfile>=0.13.0",
    "numpy<2.0",
    "scipy>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["transformers.*", "soundfile.*"]
ignore_missing_imports = true
